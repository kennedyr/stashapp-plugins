name: ossm-interactive
description: Connects StashApp to OSSM-Sauce and syncs Funscripts.
version: 1.3.2
url: https://github.com/kennedyr/stashapp-plugins
ui:
  javascript:
    - main.iife.js

settings:
  serverUrl:
    type: STRING
    displayName: Server URL
    description: The address of your OSSM Sauce WS server (e.g. ws://localhost:12345)
  debug:
    type: BOOLEAN
    displayName: Debug
    description: Enables additional logging